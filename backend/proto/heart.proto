syntax = "proto3";

package heart;


// ============================================================
// HEART DISEASE PREDICTION SERVICE
// ============================================================

service HeartPredictionService {
  rpc PredictHeartDisease (HeartRequest) returns (HeartResponse);
}

message HeartRequest {
  repeated float features = 1;
  int32 lamport_time = 2;
}

message HeartResponse {
  int32 result = 1;
  float probability = 2;
  string message = 3;
  string risk_level = 4;
  repeated string tips = 5;
  int32 lamport_time = 6;
}


// ============================================================
// RICART-AGRAWALA MUTUAL EXCLUSION SERVICE
// ============================================================

service MutexService {
  rpc RequestAccess (AccessRequest) returns (AccessReply);
}

message AccessRequest {
  int32 node_id = 1;
  int32 timestamp = 2;
}

message AccessReply {
  int32 node_id = 1;
  int32 timestamp = 2;
}

// ============================================================
// Experiment 5: Deadlock Simulation & Resolution
// ============================================================

service LockService {
    rpc AcquireLock (LockRequest) returns (LockReply);
    rpc ReleaseLock (LockRequest) returns (LockReply);
}

message LockRequest {
    string resource_id = 1;
    int32 holder_id = 2;
    int32 timestamp = 3;
}

message LockReply {
    bool granted = 1;
    string message = 2;
}