
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heart-disease-backend
  template:
    metadata:
      labels:
        app: heart-disease-backend
    spec:
      containers:
        - name: heart-disease-backend
          image: heart-disease-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: heart-disease-service
spec:
  selector:
    app: heart-disease-backend
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
  type: ClusterIP
